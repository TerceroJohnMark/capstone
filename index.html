<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusReport - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-slate-800" id="loginCardTitle">Welcome to CampusReport</h1>
      <p class="text-slate-500 text-sm mt-1">Sign in to your account</p>
    </div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Email Address</label>
        <input type="email" id="loginEmail" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
        <input type="password" id="loginPassword" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <p id="loginError" class="text-red-500 text-xs"></p>
      <button type="submit" id="loginBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition">Sign In</button>
    </form>

    <div class="text-center mt-6">
      <p class="text-sm text-slate-600">
        <span id="authToggleText">Don't have an account?</span> 
        <a href="#" id="toggleAuthMode" class="text-blue-600 font-medium hover:underline">Create account</a>
      </p>
    </div>
  </div>

  <script type="module" src="auth.js"></script>
</body>
</html>
